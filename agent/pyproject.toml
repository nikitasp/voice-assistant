[project]
name = "meridian-agent"
version = "0.1.0"
description = "Meridian Voice Concierge LiveKit agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "livekit-agents[openai,silero,turn-detector,cartesia,deepgram]==1.8.5",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concierge"]

# Include the persona prompt in the installed package (not only .py files).
[tool.hatch.build.targets.wheel.force-include]
"concierge/prompts/concierge.md" = "concierge/prompts/concierge.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: needs a running, seeded backend at BACKEND_URL"]

[tool.ruff]
line-length = 100
target-version = "py312"
