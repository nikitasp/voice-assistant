[project]
name = "meridian-backend"
version = "0.1.0"
description = "Meridian Voice Concierge FastAPI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "livekit-api>=0.8.0",
  "numpy>=2.1.0",
  "pgvector>=0.3.6",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "pyyaml>=6.0.2",
  "sentence-transformers>=3.3.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "torch>=2.5.0",
  "uvicorn[standard]>=0.32.0",
]

[tool.uv]
# Prefer CPU wheels — GPU CUDA packs are unnecessary for MiniLM embeddings.
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "asgi-lifespan>=2.1",
  "pyyaml>=6.0",
  "pyjwt>=2.9",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["perf: latency checks (NF-1)"]

[tool.ruff]
line-length = 100
target-version = "py312"
